<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amaze Backend Workbench</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        --line: #d0d7de;
        --muted: #59636e;
        --accent: #0969da;
        --selected: #ddf4ff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --line: #3d444d; --muted: #9198a1; --accent: #4493f8; --selected: #13233a; }
      }
      body { margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
               border-bottom: 1px solid var(--line); padding-bottom: 12px; }
      header h1 { font-size: 1.25rem; margin: 0; }
      nav { display: flex; gap: 16px; }
      nav a { color: var(--accent); text-decoration: none; padding: 4px 0; }
      nav a[aria-current="page"] { font-weight: 600; border-bottom: 2px solid var(--accent); }
      .who { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
      h2 { font-size: 1.1rem; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
      dt { font-weight: 600; }
      dd { margin: 0; }
      .ok { color: #1a7f37; }
      .bad { color: #cf222e; }
      .muted { color: var(--muted); }
      select, input { font: inherit; padding: 4px 6px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .filters button { font: inherit; padding: 4px 10px; border: 1px solid var(--line);
                        background: transparent; color: inherit; border-radius: 4px; cursor: pointer; }
      .filters button[aria-pressed="true"] { background: var(--selected); border-color: var(--accent); }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-weight: 600; white-space: nowrap; }
      tbody tr.clickable { cursor: pointer; }
      tbody tr.clickable:hover, tbody tr[aria-selected="true"] { background: var(--selected); }
      code { font-size: 0.88rem; }
      .detail { margin-top: 16px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; }
      .empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
