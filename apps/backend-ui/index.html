<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amaze Backend Workbench</title>
    <link rel="icon" href="data:," />
    <!--
      The shell and the class names of views not yet converted (phase 7.5). Colours only through the theme's CSS
      variables (src/theme.ts: --amz-* and Mantine's), which switch with the light or dark scheme.
    -->
    <style>
      body { margin: 0; }
      .app-header { background: var(--amz-header); color: var(--amz-on-fill); }
      .app-header-inner { max-width: 1200px; margin-inline: auto; padding: 8px 16px; display: flex; flex-wrap: wrap;
                          align-items: center; gap: 8px 24px; }
      .app-header h1 { color: var(--amz-on-fill); margin: 0; }
      .app-nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .app-nav a { color: var(--amz-on-fill); text-decoration: none; padding: 8px; border-bottom: 3px solid transparent; }
      .app-nav a:hover { text-decoration: underline; }
      .app-nav a[aria-current="page"] { font-weight: 600; border-bottom-color: var(--amz-marker); }
      .who { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .who label { color: var(--amz-on-fill); }
      .who-error { background: var(--amz-danger); color: var(--amz-on-fill); border-radius: 4px; padding: 2px 8px; }
      .app-main { max-width: 1200px; margin: 16px auto 0; padding: 0 16px; }
      .app-panel { background: var(--amz-panel); border: 1px solid var(--amz-line); border-radius: 6px; padding: 16px 20px; }
      footer { max-width: 1200px; margin: 16px auto 24px; padding: 0 16px; color: var(--amz-muted); font-size: 12px; }
      :focus-visible, .mantine-focus-auto:focus-visible { outline: 2px solid var(--amz-focus); outline-offset: 2px; }
      h2, h3, h4 { color: var(--amz-heading); font-weight: 600; }
      h2 { font-size: 20px; margin: 0 0 12px; }
      h3 { font-size: 16px; margin: 24px 0 8px; }
      h4 { font-size: 14px; margin: 16px 0 8px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
      dt { font-weight: 600; }
      dd { margin: 0; }
      .ok { color: var(--amz-success-text); }
      .bad { color: var(--amz-danger-text); }
      .muted { color: var(--amz-muted); }
      select, input, textarea, button { font: inherit; color: inherit; }
      input[type="checkbox"], input[type="radio"] { accent-color: var(--amz-primary); }
      :where(button):not([class*="mantine"]) { padding: 4px 12px; background: var(--amz-panel); border: 1px solid var(--amz-line);
                                               border-radius: 6px; cursor: pointer; }
      :where(button):not([class*="mantine"]):disabled { color: var(--amz-muted); background: var(--amz-subtle);
                                                        border-color: var(--amz-disabled); cursor: default; }
      :where(select, input:not([type="radio"], [type="checkbox"]), textarea):not([class*="mantine"]) {
        padding: 4px 8px; background: var(--amz-panel); border: 1px solid var(--amz-line); border-radius: 6px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .filters button { font: inherit; padding: 4px 12px; border: 1px solid var(--amz-line); background: transparent;
                        color: inherit; border-radius: 6px; cursor: pointer; }
      .filters button[aria-pressed="true"] { background: var(--amz-subtle); border-color: var(--amz-primary); }
      .table-wrap { overflow-x: auto; }
      table:not([class*="mantine"]) { border-collapse: collapse; width: 100%; }
      table:not([class*="mantine"]) :is(th, td) { text-align: left; padding: 8px; border-bottom: 1px solid var(--amz-line);
                                                  vertical-align: top; }
      table:not([class*="mantine"]) th { font-weight: 600; white-space: nowrap; }
      tbody tr.clickable { cursor: pointer; }
      tbody tr.clickable:hover, tbody tr[aria-selected="true"] { background: var(--amz-subtle); }
      code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
      .detail { margin-top: 16px; padding: 12px 16px; border: 1px solid var(--amz-line); border-radius: 6px; }
      .run-banner { margin: 0 0 16px; border-left: 4px solid var(--amz-info); }
      .hits { list-style: none; padding: 0; }
      .hits li { border: 1px solid var(--amz-line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
      .empty { padding: 24px; text-align: center; color: var(--amz-muted); border: 1px dashed var(--amz-line);
               border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
