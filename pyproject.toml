[project]
name = "amaze-cm-poc"
version = "0.0.0"
description = "Amaze for Capital Markets proof of concept"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# Starlette's TestClient asks for the httpx2 package instead of httpx. Kept on httpx until httpx2
# is vetted (open item in docs/plans/phase-0.md). Only this one warning is silenced.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
